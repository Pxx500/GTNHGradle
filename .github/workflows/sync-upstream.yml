name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Create or update upstream sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/GTNewHorizons/GTNHGradle.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master master; then
            exit 0
          fi

          git switch --force-create sync/upstream-master upstream/master
          git push --force-with-lease origin sync/upstream-master

          pr_number=$(gh pr list --base master --head sync/upstream-master --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base master \
              --head sync/upstream-master \
              --title "Sync upstream master" \
              --body "Syncs this fork with the latest GTNewHorizons/GTNHGradle master."
            pr_number=$(gh pr list --base master --head sync/upstream-master --state open --json number --jq '.[0].number')
          fi

          if ! gh pr merge "$pr_number" --auto --merge; then
            mergeable=$(gh pr view "$pr_number" --json mergeable --jq '.mergeable')
            if [ "$mergeable" != "CONFLICTING" ]; then
              exit 1
            fi
          fi
